name: Deploy

# main (push or manual run) → production, pull requests → preview URL.
# Vercel's own Git auto-deploy is switched off in vercel.json so this is the only pipeline.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check local asset references
        run: |
          missing=0
          for ref in $(grep -oE '(src|href|poster|data-src)="[^"]+"' index.html \
                        | sed -E 's/^[a-z-]+="//; s/"$//' \
                        | grep -vE '^(https?:|#|mailto:|tel:|data:|//)' | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "::warning file=index.html::Missing asset: $ref"
              missing=$((missing + 1))
            fi
          done
          echo "$missing missing asset(s)"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      TARGET: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$VERCEL_ORG_ID" in team_*) ;; *) echo "::error::VERCEL_ORG_ID should start with team_ (check it isn't swapped with the project id)"; exit 1;; esac
          case "$VERCEL_PROJECT_ID" in prj_*) ;; *) echo "::error::VERCEL_PROJECT_ID should start with prj_"; exit 1;; esac
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          case "$status" in
            200) echo "Token can see the project." ;;
            401) echo "::error::VERCEL_TOKEN is invalid or expired. Create a new one at vercel.com/account/tokens."; exit 1 ;;
            403) echo "::error::VERCEL_TOKEN can't access the Abhi team. Create a token with scope set to the Abhi team."; exit 1 ;;
            404) echo "::error::Project not found in that team. Check VERCEL_ORG_ID / VERCEL_PROJECT_ID match .vercel/project.json."; exit 1 ;;
            *)   echo "::error::Vercel API returned HTTP $status while checking the project."; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=$TARGET --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
